<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#E89252" />
<title>Sign in — oportunities.</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --accent: #E68F47; --apricot: #E89252; --terracotta: #D87B6E; --purple: #6B4FA0;
    --cream: #FDF8F3; --cream-light: #F4ECE0; --ink: #0F0D0B; --ink-soft: #4A453F;
    --display: 'Geist', system-ui, sans-serif; --body: 'Inter', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--cream); color: var(--ink); font-family: var(--body); line-height: 1.5; -webkit-font-smoothing: antialiased; min-height: 100vh; }
  a { color: inherit; text-decoration: none; }
  .page { min-height: 100vh; display: flex; flex-direction: column; }
  header { padding: 24px 32px; }
  .wordmark { font-family: var(--display); font-weight: 600; font-size: 32px; letter-spacing: -0.04em; }
  .wordmark .dot { color: var(--apricot); }
  main { flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 40px 24px; }
  .card { background: white; max-width: 420px; width: 100%; border: 1px solid rgba(15,13,11,0.06); border-radius: 16px; padding: 40px; }
  .card h1 { font-family: var(--display); font-size: 28px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 6px; }
  .card .sub { color: var(--ink-soft); font-size: 15px; margin-bottom: 28px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--ink-soft); }
  .field input { width: 100%; padding: 12px 14px; border: 1px solid rgba(15,13,11,0.15); border-radius: 8px; font-family: var(--body); font-size: 15px; background: var(--cream); transition: border-color 0.2s; }
  .field input:focus { outline: none; border-color: var(--apricot); box-shadow: 0 0 0 3px rgba(232,146,82,0.15); }
  .forgot { text-align: right; margin-top: 4px; }
  .forgot a { font-size: 13px; color: var(--apricot); font-weight: 500; }
  .btn-primary { width: 100%; background: var(--apricot); color: var(--ink); padding: 14px; border-radius: 10px; font-weight: 600; font-size: 15px; border: 0; cursor: pointer; font-family: var(--body); margin-top: 8px; }
  .divider { display: flex; align-items: center; gap: 12px; margin: 24px 0; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft); }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(15,13,11,0.1); }
  .btn-oauth { width: 100%; background: white; color: var(--ink); padding: 12px; border-radius: 10px; font-weight: 500; font-size: 14px; border: 1px solid rgba(15,13,11,0.15); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; font-family: var(--body); margin-bottom: 10px; }
  .btn-oauth:hover { background: var(--cream-light); }
  .btn-oauth .icon { width: 18px; height: 18px; }
  .footer-line { margin-top: 28px; text-align: center; font-size: 14px; color: var(--ink-soft); }
  .footer-line a { color: var(--apricot); font-weight: 600; }
  footer { padding: 24px 32px; font-size: 12px; color: var(--ink-soft); text-align: center; }
</style>
</head>
<body>
<div class="page">
  <header>
    <a href="landing.html" class="wordmark">oportunities<span class="dot">.</span></a>
  </header>
  <main>
    <div class="card">
      <h1>Welcome back.</h1>
      <p class="sub">Sign in to your Oportunities account.</p>

      <form>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@brand.com" autocomplete="email" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" />
          <div class="forgot"><a href="#">Forgot password?</a></div>
        </div>
        <button type="submit" class="btn-primary">Sign in</button>
      </form>

      <div class="divider">or continue with</div>

      <button class="btn-oauth">
        <svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M22 12.1c0-.7-.1-1.4-.2-2.1H12v4h5.6c-.2 1.3-1 2.4-2 3.1v2.6h3.3c1.9-1.8 3.1-4.4 3.1-7.6z" fill="#4285F4"/><path d="M12 22c2.7 0 5-1 6.6-2.4l-3.3-2.6c-.9.6-2.1 1-3.3 1-2.6 0-4.7-1.7-5.5-4.1H3.1v2.6C4.7 19.8 8.1 22 12 22z" fill="#34A853"/><path d="M6.5 13.9c-.2-.6-.3-1.3-.3-1.9s.1-1.3.3-1.9V7.5H3.1C2.4 8.9 2 10.4 2 12s.4 3.1 1.1 4.5l3.4-2.6z" fill="#FBBC05"/><path d="M12 6c1.5 0 2.8.5 3.9 1.5l2.9-2.9C17 3 14.7 2 12 2 8.1 2 4.7 4.2 3.1 7.5l3.4 2.6C7.3 7.7 9.4 6 12 6z" fill="#EA4335"/></svg>
        Sign in with Google
      </button>
      <button class="btn-oauth">
        <svg class="icon" viewBox="0 0 24 24" fill="#000"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
        Sign in with Apple
      </button>

      <p class="footer-line">Don't have an account? <a href="signup.html">Create one</a></p>
    </div>
  </main>
  <footer>© 2026 Oportunities. Made in India.</footer>
</div>
</body>
</html>
