<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" role="img" aria-label="oportunities X profile banner">
  <title>oportunities — X profile header (1500×500)</title>
  <desc>X / Twitter profile header with wordmark and tagline.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF8F3"/>
      <stop offset="100%" stop-color="#F4ECE0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E68F47"/>
      <stop offset="50%" stop-color="#D87B6E"/>
      <stop offset="100%" stop-color="#7B5BFF"/>
    </linearGradient>
    <style>
      .wm    { font-family: "Geist", "Inter", sans-serif; font-weight: 600; font-size: 108px; letter-spacing: -0.04em; fill: #0F0D0B; }
      .dot   { fill: #E68F47; }
      .head  { font-family: "Geist", "Inter", sans-serif; font-weight: 600; font-size: 38px; letter-spacing: -0.02em; fill: #0F0D0B; }
      .tag   { font-family: "Geist", "Inter", sans-serif; font-weight: 400; font-size: 26px; letter-spacing: -0.01em; fill: #4A453F; }
      .pill  { font-family: "Geist Mono", "JetBrains Mono", ui-monospace, monospace; font-weight: 500; font-size: 18px; letter-spacing: 0.1em; fill: #7B5BFF; text-transform: uppercase; }
    </style>
  </defs>
  <rect width="1500" height="500" fill="url(#bg)"/>
  <rect x="0" y="0" width="1500" height="8" fill="url(#sweep)"/>
  <rect x="0" y="492" width="1500" height="8" fill="url(#sweep)"/>

  <text x="120" y="100" class="pill">Built in Mumbai · India-first</text>
  <text x="120" y="240" class="wm">oportunities</text>
  <text x="120" y="240" class="wm dot" dx="606">.</text>
  <text x="120" y="310" class="head">Know what creators are about to do.</text>
  <text x="120" y="360" class="tag">Creator-intent intelligence · 30 days ahead · paid beta open</text>

  <circle cx="1360" cy="240" r="56" fill="#E68F47"/>
  <circle cx="1260" cy="240" r="28" fill="#7B5BFF"/>
</svg>
