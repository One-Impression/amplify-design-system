<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 627" role="img" aria-label="oportunities X card 1 — Blog feature">
  <title>oportunities — X card 1 — Blog / feature article</title>
  <desc>Twitter summary card for a blog post.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF8F3"/>
      <stop offset="100%" stop-color="#F4ECE0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E68F47"/>
      <stop offset="100%" stop-color="#7B5BFF"/>
    </linearGradient>
    <style>
      .wm    { font-family: "Geist", "Inter", sans-serif; font-weight: 600; font-size: 40px; letter-spacing: -0.04em; fill: #0F0D0B; }
      .dot   { fill: #E68F47; }
      .kicker{ font-family: "Geist Mono", "JetBrains Mono", ui-monospace, monospace; font-weight: 500; font-size: 18px; letter-spacing: 0.1em; fill: #7B5BFF; text-transform: uppercase; }
      .head  { font-family: "Geist", "Inter", sans-serif; font-weight: 600; font-size: 64px; letter-spacing: -0.03em; fill: #0F0D0B; }
      .meta  { font-family: "Geist", "Inter", sans-serif; font-weight: 400; font-size: 22px; fill: #4A453F; }
      .url   { font-family: "Geist Mono", "JetBrains Mono", ui-monospace, monospace; font-weight: 500; font-size: 20px; letter-spacing: 0.04em; fill: #6B635A; }
    </style>
  </defs>
  <rect width="1200" height="627" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#sweep)"/>

  <text x="72" y="84" class="wm">oportunities</text>
  <text x="72" y="84" class="wm dot" dx="226">.</text>

  <text x="72" y="200" class="kicker">Article · Read · 8 min</text>
  <text x="72" y="300" class="head">Why cold outreach</text>
  <text x="72" y="370" class="head">to creators is dead.</text>

  <rect x="72" y="430" width="60" height="4" fill="#E68F47"/>
  <text x="72" y="490" class="meta">A 2026 deep dive into India's creator economy</text>
  <text x="72" y="525" class="meta">and the 97% reply-rate problem.</text>

  <text x="72" y="580" class="url">oportunities.in/blog/cold-outreach-is-dead</text>
</svg>
