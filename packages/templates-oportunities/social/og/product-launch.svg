<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="oportunities product launch Open Graph image">
  <title>oportunities — Open Graph launch (1200×630) — Oportunities is live</title>
  <desc>Open Graph image for the product launch announcement.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF8F3"/>
      <stop offset="100%" stop-color="#F4ECE0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E68F47"/>
      <stop offset="50%" stop-color="#D87B6E"/>
      <stop offset="100%" stop-color="#7B5BFF"/>
    </linearGradient>
    <style>
      .wm    { font-family: "Geist", "Inter", sans-serif; font-weight: 600; font-size: 44px; letter-spacing: -0.04em; fill: #0F0D0B; }
      .dot   { fill: #E68F47; }
      .kicker{ font-family: "Geist Mono", "JetBrains Mono", ui-monospace, monospace; font-weight: 500; font-size: 20px; letter-spacing: 0.1em; fill: #FDF8F3; text-transform: uppercase; }
      .head  { font-family: "Geist", "Inter", sans-serif; font-weight: 600; font-size: 108px; letter-spacing: -0.04em; fill: #0F0D0B; }
      .sub   { font-family: "Geist", "Inter", sans-serif; font-weight: 400; font-size: 30px; fill: #4A453F; }
    </style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="8" fill="url(#sweep)"/>
  <rect x="0" y="622" width="1200" height="8" fill="url(#sweep)"/>

  <text x="80" y="92" class="wm">oportunities</text>
  <text x="80" y="92" class="wm dot" dx="248">.</text>

  <rect x="80" y="150" width="240" height="44" rx="22" fill="#7B5BFF"/>
  <text x="104" y="180" class="kicker">Now live · India</text>

  <text x="80" y="350" class="head">Oportunities</text>
  <text x="80" y="460" class="head">is live.</text>

  <text x="80" y="540" class="sub">Creator-intent intelligence — for India's brand teams.</text>

  <circle cx="1080" cy="380" r="56" fill="#E68F47"/>
  <circle cx="980" cy="380" r="28" fill="#7B5BFF"/>
</svg>
