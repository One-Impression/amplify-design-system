<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="oportunities default Open Graph image">
  <title>oportunities — Open Graph default (1200×630)</title>
  <desc>Default site-wide Open Graph share image.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF8F3"/>
      <stop offset="100%" stop-color="#F4ECE0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E68F47"/>
      <stop offset="50%" stop-color="#D87B6E"/>
      <stop offset="100%" stop-color="#7B5BFF"/>
    </linearGradient>
    <style>
      .wm   { font-family: "Geist", "Inter", sans-serif; font-weight: 600; font-size: 132px; letter-spacing: -0.04em; fill: #0F0D0B; }
      .dot  { fill: #E68F47; }
      .tag  { font-family: "Geist", "Inter", sans-serif; font-weight: 400; font-size: 34px; letter-spacing: -0.01em; fill: #4A453F; }
      .pill { font-family: "Geist Mono", "JetBrains Mono", ui-monospace, monospace; font-weight: 500; font-size: 18px; letter-spacing: 0.1em; fill: #7B5BFF; text-transform: uppercase; }
    </style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="8" fill="url(#sweep)"/>
  <rect x="0" y="622" width="1200" height="8" fill="url(#sweep)"/>

  <text x="80" y="120" class="pill">Creator-intent intelligence · India</text>
  <text x="80" y="340" class="wm">oportunities</text>
  <text x="80" y="340" class="wm dot" dx="744">.</text>
  <text x="80" y="410" class="tag">Know what creators are about to do.</text>

  <circle cx="1080" cy="540" r="40" fill="#E68F47"/>
  <circle cx="1010" cy="540" r="20" fill="#7B5BFF"/>
</svg>
