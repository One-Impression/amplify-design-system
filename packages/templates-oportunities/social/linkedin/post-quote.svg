<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 627" role="img" aria-label="oportunities LinkedIn quote post">
  <title>oportunities — LinkedIn pull-quote testimonial</title>
  <desc>Testimonial pull-quote template with attribution.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF8F3"/>
      <stop offset="100%" stop-color="#F4ECE0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E68F47"/>
      <stop offset="100%" stop-color="#7B5BFF"/>
    </linearGradient>
    <style>
      .wm    { font-family: "Geist", "Inter", sans-serif; font-weight: 600; font-size: 40px; letter-spacing: -0.04em; fill: #0F0D0B; }
      .dot   { fill: #E68F47; }
      .mark  { font-family: "Geist", "Inter", sans-serif; font-weight: 600; font-size: 220px; letter-spacing: -0.04em; fill: #E68F47; opacity: 0.4; }
      .quote { font-family: "Geist", "Inter", sans-serif; font-weight: 500; font-size: 44px; letter-spacing: -0.02em; fill: #0F0D0B; }
      .name  { font-family: "Geist", "Inter", sans-serif; font-weight: 600; font-size: 26px; letter-spacing: -0.01em; fill: #0F0D0B; }
      .role  { font-family: "Geist", "Inter", sans-serif; font-weight: 400; font-size: 22px; fill: #4A453F; }
    </style>
  </defs>
  <rect width="1200" height="627" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#sweep)"/>

  <text x="72" y="84" class="wm">oportunities</text>
  <text x="72" y="84" class="wm dot" dx="226">.</text>

  <text x="100" y="280" class="mark">&#8220;</text>

  <text x="120" y="320" class="quote">Oportunities flipped our outreach model.</text>
  <text x="120" y="380" class="quote">We stopped chasing creators and started</text>
  <text x="120" y="440" class="quote">showing up exactly when they needed us.</text>

  <rect x="120" y="490" width="60" height="4" fill="#E68F47"/>
  <text x="120" y="540" class="name">Priya Kapoor</text>
  <text x="120" y="572" class="role">Head of Influencer Marketing, Mamaearth</text>
</svg>
