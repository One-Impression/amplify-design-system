<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 627" role="img" aria-label="oportunities LinkedIn case study post">
  <title>oportunities — LinkedIn case study — Mamaearth 22 partnerships in 30 days</title>
  <desc>Customer success post featuring Mamaearth.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF8F3"/>
      <stop offset="100%" stop-color="#F4ECE0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E68F47"/>
      <stop offset="100%" stop-color="#7B5BFF"/>
    </linearGradient>
    <style>
      .wm    { font-family: "Geist", "Inter", sans-serif; font-weight: 600; font-size: 40px; letter-spacing: -0.04em; fill: #0F0D0B; }
      .dot   { fill: #E68F47; }
      .kicker{ font-family: "Geist Mono", "JetBrains Mono", ui-monospace, monospace; font-weight: 500; font-size: 18px; letter-spacing: 0.1em; fill: #7B5BFF; text-transform: uppercase; }
      .head  { font-family: "Geist", "Inter", sans-serif; font-weight: 600; font-size: 60px; letter-spacing: -0.03em; fill: #0F0D0B; }
      .brand { font-family: "Geist", "Inter", sans-serif; font-weight: 600; font-size: 60px; letter-spacing: -0.03em; fill: #7B5BFF; }
      .num   { font-family: "Geist", "Inter", sans-serif; font-weight: 600; font-size: 96px; letter-spacing: -0.04em; fill: #E68F47; }
      .lab   { font-family: "Geist", "Inter", sans-serif; font-weight: 400; font-size: 24px; fill: #4A453F; }
    </style>
  </defs>
  <rect width="1200" height="627" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#sweep)"/>

  <text x="72" y="84" class="wm">oportunities</text>
  <text x="72" y="84" class="wm dot" dx="226">.</text>

  <text x="72" y="180" class="kicker">Customer story</text>
  <text x="72" y="270" class="head">How <tspan class="brand">Mamaearth</tspan> booked</text>
  <text x="72" y="335" class="head">22 partnerships in 30 days.</text>

  <text x="72" y="490" class="num">22</text>
  <text x="72" y="540" class="lab">paid partnerships closed</text>

  <text x="400" y="490" class="num">30</text>
  <text x="400" y="540" class="lab">days end-to-end</text>

  <text x="700" y="490" class="num">7.4x</text>
  <text x="700" y="540" class="lab">vs cold outreach</text>

  <circle cx="1100" cy="200" r="40" fill="#E68F47"/>
</svg>
