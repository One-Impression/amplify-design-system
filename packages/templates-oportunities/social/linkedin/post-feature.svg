<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 627" role="img" aria-label="oportunities LinkedIn feature post">
  <title>oportunities — LinkedIn feature post — Introducing AI Idea Feed</title>
  <desc>Feature announcement post for the AI Idea Feed product.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF8F3"/>
      <stop offset="100%" stop-color="#F4ECE0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E68F47"/>
      <stop offset="100%" stop-color="#7B5BFF"/>
    </linearGradient>
    <style>
      .wm   { font-family: "Geist", "Inter", sans-serif; font-weight: 600; font-size: 40px; letter-spacing: -0.04em; fill: #0F0D0B; }
      .dot  { fill: #E68F47; }
      .kicker{ font-family: "Geist Mono", "JetBrains Mono", ui-monospace, monospace; font-weight: 500; font-size: 18px; letter-spacing: 0.1em; fill: #7B5BFF; text-transform: uppercase; }
      .head { font-family: "Geist", "Inter", sans-serif; font-weight: 600; font-size: 84px; letter-spacing: -0.03em; fill: #0F0D0B; }
      .sub  { font-family: "Geist", "Inter", sans-serif; font-weight: 400; font-size: 26px; letter-spacing: -0.01em; fill: #4A453F; }
      .chip { font-family: "Geist", "Inter", sans-serif; font-weight: 500; font-size: 20px; fill: #0F0D0B; }
    </style>
  </defs>
  <rect width="1200" height="627" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#sweep)"/>

  <text x="72" y="84" class="wm">oportunities</text>
  <text x="72" y="84" class="wm dot" dx="226">.</text>

  <text x="72" y="220" class="kicker">Introducing</text>
  <text x="72" y="320" class="head">AI Idea Feed</text>
  <text x="72" y="380" class="sub">The signal stream that surfaces what creators</text>
  <text x="72" y="420" class="sub">like Komal Pandey will post next — before they do.</text>

  <rect x="72" y="480" width="240" height="56" rx="28" fill="#FFFFFF" stroke="#E68F47" stroke-width="2"/>
  <text x="100" y="516" class="chip">Real-time signals</text>

  <rect x="332" y="480" width="220" height="56" rx="28" fill="#FFFFFF" stroke="#E68F47" stroke-width="2"/>
  <text x="360" y="516" class="chip">30-day horizon</text>

  <rect x="572" y="480" width="200" height="56" rx="28" fill="#FFFFFF" stroke="#E68F47" stroke-width="2"/>
  <text x="600" y="516" class="chip">India-first</text>

  <circle cx="1080" cy="320" r="64" fill="#E68F47" opacity="0.95"/>
  <circle cx="980" cy="320" r="32" fill="#7B5BFF" opacity="0.85"/>
</svg>
