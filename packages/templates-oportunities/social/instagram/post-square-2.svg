<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" role="img" aria-label="oportunities Instagram square 2 — Heads up card">
  <title>oportunities — Instagram square 2 — Heads up creator example</title>
  <desc>Heads up signal card showing Komal Pandey example.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF8F3"/>
      <stop offset="100%" stop-color="#F4ECE0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E68F47"/>
      <stop offset="100%" stop-color="#7B5BFF"/>
    </linearGradient>
    <style>
      .wm    { font-family: "Geist", "Inter", sans-serif; font-weight: 600; font-size: 56px; letter-spacing: -0.04em; fill: #0F0D0B; }
      .dot   { fill: #E68F47; }
      .kicker{ font-family: "Geist Mono", "JetBrains Mono", ui-monospace, monospace; font-weight: 500; font-size: 22px; letter-spacing: 0.1em; fill: #7B5BFF; text-transform: uppercase; }
      .head  { font-family: "Geist", "Inter", sans-serif; font-weight: 600; font-size: 84px; letter-spacing: -0.03em; fill: #0F0D0B; }
      .name  { font-family: "Geist", "Inter", sans-serif; font-weight: 600; font-size: 36px; letter-spacing: -0.02em; fill: #0F0D0B; }
      .meta  { font-family: "Geist", "Inter", sans-serif; font-weight: 400; font-size: 24px; fill: #4A453F; }
      .sig   { font-family: "Geist", "Inter", sans-serif; font-weight: 500; font-size: 28px; letter-spacing: -0.01em; fill: #0F0D0B; }
      .small { font-family: "Geist Mono", "JetBrains Mono", ui-monospace, monospace; font-weight: 500; font-size: 18px; letter-spacing: 0.06em; fill: #6B635A; text-transform: uppercase; }
    </style>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect x="0" y="0" width="1080" height="8" fill="url(#sweep)"/>

  <text x="80" y="130" class="wm">oportunities</text>
  <text x="80" y="130" class="wm dot" dx="318">.</text>

  <text x="80" y="270" class="kicker">Heads up —</text>
  <text x="80" y="380" class="head">A creator is</text>
  <text x="80" y="470" class="head">about to drop.</text>

  <rect x="80" y="540" width="920" height="380" rx="32" fill="#FFFFFF" stroke="#E68F47" stroke-width="3"/>
  <circle cx="160" cy="640" r="48" fill="#E68F47"/>
  <text x="230" y="630" class="name">Komal Pandey</text>
  <text x="230" y="668" class="meta">Fashion · 2.1M followers · Mumbai</text>

  <text x="120" y="760" class="small">Predicted signal</text>
  <text x="120" y="810" class="sig">Sustainable summer fits — June 2026</text>

  <text x="120" y="870" class="small">Likely brand fit</text>
  <text x="120" y="900" class="sig">Plum  ·  Wakefit  ·  Mamaearth</text>

  <circle cx="990" cy="1010" r="32" fill="#E68F47"/>
</svg>
