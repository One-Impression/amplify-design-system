<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" role="img" aria-label="oportunities carousel slide 7 of 7 — CTA">
  <title>oportunities — Carousel 7/7 — Get early access</title>
  <desc>Final carousel slide with CTA for early access.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF8F3"/>
      <stop offset="100%" stop-color="#F4ECE0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E68F47"/>
      <stop offset="100%" stop-color="#7B5BFF"/>
    </linearGradient>
    <style>
      .wm    { font-family: "Geist", "Inter", sans-serif; font-weight: 600; font-size: 60px; letter-spacing: -0.04em; fill: #0F0D0B; }
      .dot   { fill: #E68F47; }
      .kicker{ font-family: "Geist Mono", "JetBrains Mono", ui-monospace, monospace; font-weight: 500; font-size: 22px; letter-spacing: 0.1em; fill: #7B5BFF; text-transform: uppercase; }
      .head  { font-family: "Geist", "Inter", sans-serif; font-weight: 600; font-size: 128px; letter-spacing: -0.03em; fill: #0F0D0B; }
      .sub   { font-family: "Geist", "Inter", sans-serif; font-weight: 400; font-size: 32px; fill: #4A453F; }
      .cta   { font-family: "Geist", "Inter", sans-serif; font-weight: 500; font-size: 30px; fill: #FDF8F3; text-anchor: middle; }
      .url   { font-family: "Geist Mono", "JetBrains Mono", ui-monospace, monospace; font-weight: 500; font-size: 26px; letter-spacing: 0.04em; fill: #4A453F; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect x="0" y="0" width="1080" height="8" fill="url(#sweep)"/>

  <text x="80" y="140" class="wm">oportunities</text>
  <text x="80" y="140" class="wm dot" dx="338">.</text>

  <text x="80" y="280" class="kicker">Your move</text>
