  <text x="540" y="822" class="cta">Reserve early access →</text>

  <text x="540" y="910" class="url">oportunities.in/early</text>

  <rect x="80" y="960" width="60" height="6" fill="#F4ECE0"/>
  <rect x="160" y="960" width="60" height="6" fill="#F4ECE0"/>
  <rect x="240" y="960" width="60" height="6" fill="#F4ECE0"/>
  <rect x="320" y="960" width="60" height="6" fill="#F4ECE0"/>
  <rect x="400" y="960" width="60" height="6" fill="#F4ECE0"/>
  <rect x="480" y="960" width="60" height="6" fill="#F4ECE0"/>
  <rect x="560" y="960" width="60" height="6" fill="#E68F47"/>
