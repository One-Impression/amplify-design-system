<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" role="img" aria-label="oportunities Instagram story 5 — Get early access">
  <title>oportunities — Instagram story 5 — CTA early access</title>
  <desc>Call-to-action for early access signup.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDF8F3"/>
      <stop offset="100%" stop-color="#F4ECE0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E68F47"/>
      <stop offset="100%" stop-color="#7B5BFF"/>
    </linearGradient>
    <style>
      .wm    { font-family: "Geist", "Inter", sans-serif; font-weight: 600; font-size: 64px; letter-spacing: -0.04em; fill: #0F0D0B; }
      .dot   { fill: #E68F47; }
      .kicker{ font-family: "Geist Mono", "JetBrains Mono", ui-monospace, monospace; font-weight: 500; font-size: 26px; letter-spacing: 0.1em; fill: #7B5BFF; text-transform: uppercase; }
      .head  { font-family: "Geist", "Inter", sans-serif; font-weight: 600; font-size: 140px; letter-spacing: -0.04em; fill: #0F0D0B; }
      .sub   { font-family: "Geist", "Inter", sans-serif; font-weight: 400; font-size: 36px; letter-spacing: -0.01em; fill: #4A453F; }
      .cta   { font-family: "Geist", "Inter", sans-serif; font-weight: 500; font-size: 36px; fill: #FDF8F3; text-anchor: middle; }
      .url   { font-family: "Geist Mono", "JetBrains Mono", ui-monospace, monospace; font-weight: 500; font-size: 30px; letter-spacing: 0.04em; fill: #4A453F; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/>
  <rect x="0" y="0" width="1080" height="8" fill="url(#sweep)"/>

  <text x="80" y="200" class="wm">oportunities</text>
  <text x="80" y="200" class="wm dot" dx="358">.</text>

  <text x="80" y="430" class="kicker">Limited beta · India</text>
  <text x="80" y="620" class="head">Get</text>
  <text x="80" y="760" class="head">early</text>
  <text x="80" y="900" class="head">access.</text>

  <text x="80" y="990" class="sub">For brand teams in India.</text>
  <text x="80" y="1040" class="sub">First 100 — free for 30 days.</text>

  <rect x="120" y="1500" width="840" height="120" rx="60" fill="#0F0D0B"/>
  <text x="540" y="1575" class="cta">Reserve your seat →</text>

  <text x="540" y="1700" class="url">oportunities.in/early</text>

  <circle cx="540" cy="1820" r="36" fill="#E68F47"/>
</svg>
