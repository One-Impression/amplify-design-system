      .kicker{ font-family: "Geist Mono", "JetBrains Mono", ui-monospace, monospace; font-weight: 500; font-size: 26px; letter-spacing: 0.1em; fill: #7B5BFF; text-transform: uppercase; }
      .head  { font-family: "Geist", "Inter", sans-serif; font-weight: 600; font-size: 84px; letter-spacing: -0.03em; fill: #0F0D0B; }
