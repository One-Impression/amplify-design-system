  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/>
  <rect x="0" y="0" width="1080" height="8" fill="url(#sweep)"/>

  <text x="80" y="200" class="wm">oportunities</text>
  <text x="80" y="200" class="wm dot" dx="358">.</text>

