<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" role="img" aria-label="oportunities carousel slide 2 of 7 — Problem">
  <title>oportunities — Carousel 2/7 — The problem</title>
  <desc>Problem statement slide: cold outreach is broken.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF8F3"/>
      <stop offset="100%" stop-color="#F4ECE0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E68F47"/>
      <stop offset="100%" stop-color="#7B5BFF"/>
    </linearGradient>
    <style>
      .wm    { font-family: "Geist", "Inter", sans-serif; font-weight: 600; font-size: 60px; letter-spacing: -0.04em; fill: #0F0D0B; }
      .dot   { fill: #E68F47; }
      .kicker{ font-family: "Geist Mono", "JetBrains Mono", ui-monospace, monospace; font-weight: 500; font-size: 22px; letter-spacing: 0.1em; fill: #7B5BFF; text-transform: uppercase; }
      .head  { font-family: "Geist", "Inter", sans-serif; font-weight: 600; font-size: 96px; letter-spacing: -0.03em; fill: #0F0D0B; }
      .sub   { font-family: "Geist", "Inter", sans-serif; font-weight: 400; font-size: 30px; fill: #4A453F; }
      .big   { font-family: "Geist", "Inter", sans-serif; font-weight: 600; font-size: 132px; letter-spacing: -0.04em; fill: #E68F47; }
    </style>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect x="0" y="0" width="1080" height="8" fill="url(#sweep)"/>

  <text x="80" y="140" class="wm">oportunities</text>
  <text x="80" y="140" class="wm dot" dx="338">.</text>

  <text x="80" y="280" class="kicker">The problem</text>
  <text x="80" y="400" class="head">Cold outreach</text>
  <text x="80" y="500" class="head">is broken.</text>

  <text x="80" y="650" class="big">97%</text>
  <text x="80" y="720" class="sub">of brand DMs to creators</text>
  <text x="80" y="770" class="sub">never get a reply.</text>

  <text x="80" y="880" class="sub">Reason: brands reach out too late,</text>
  <text x="80" y="920" class="sub">to creators who already booked.</text>

  <rect x="80" y="960" width="60" height="6" fill="#F4ECE0"/>
  <rect x="160" y="960" width="60" height="6" fill="#E68F47"/>
  <rect x="240" y="960" width="60" height="6" fill="#F4ECE0"/>
  <rect x="320" y="960" width="60" height="6" fill="#F4ECE0"/>
  <rect x="400" y="960" width="60" height="6" fill="#F4ECE0"/>
  <rect x="480" y="960" width="60" height="6" fill="#F4ECE0"/>
  <rect x="560" y="960" width="60" height="6" fill="#F4ECE0"/>
</svg>
