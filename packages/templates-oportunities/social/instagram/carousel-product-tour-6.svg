  <text x="720" y="700" class="num">87%</text>
  <text x="720" y="750" class="lab">reply rate</text>

  <line x1="80" y1="830" x2="1000" y2="830" stroke="#E68F47" stroke-width="2"/>
  <text x="80" y="890" class="lab">"We stopped chasing creators." — Priya K., Mamaearth</text>

  <rect x="80" y="960" width="60" height="6" fill="#F4ECE0"/>
  <rect x="160" y="960" width="60" height="6" fill="#F4ECE0"/>
  <rect x="240" y="960" width="60" height="6" fill="#F4ECE0"/>
  <rect x="320" y="960" width="60" height="6" fill="#F4ECE0"/>
  <rect x="400" y="960" width="60" height="6" fill="#F4ECE0"/>
  <rect x="480" y="960" width="60" height="6" fill="#E68F47"/>
  <rect x="560" y="960" width="60" height="6" fill="#F4ECE0"/>
