<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Oportunities — Section Divider</title>
<style>
  :root {
    --cream:      #FDF8F3;
    --ink:        #0F0D0B;
    --apricot:    #E89252;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; }
  body {
    font-family: "Geist", -apple-system, "Helvetica Neue", Arial, sans-serif;
    background: var(--cream);
    color: var(--ink);
    overflow: hidden;
  }
  .stage {
    width: 100%;
    height: 100%;
    padding: 96px 120px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 22px;
    color: rgba(15,13,11,0.6);
  }
  .wordmark {
    font-weight: 600;
    letter-spacing: -0.04em;
    font-size: 28px;
    color: var(--ink);
  }
  .wordmark .dot { color: var(--apricot); }
  .slide-no {
    font-feature-settings: "tnum";
    font-size: 22px;
  }
  .center {
    display: flex;
    flex-direction: column;
    gap: 32px;
    max-width: 1500px;
  }
  .eyebrow {
    font-size: 26px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 500;
    color: var(--apricot);
  }
  .title {
    font-weight: 600;
    letter-spacing: -0.035em;
    font-size: 200px;
    line-height: 0.95;
    color: var(--ink);
  }
  .underline {
    width: 240px;
    height: 12px;
    border-radius: 6px;
    background: var(--apricot);
  }
  .bottom-bar {
    font-size: 22px;
    color: rgba(15,13,11,0.45);
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="top-bar">
      <div class="wordmark">oportunities<span class="dot">.</span></div>
      <div class="slide-no">03 / 24</div>
    </div>

    <div class="center">
      <div class="eyebrow">Section 02</div>
      <div class="title">The moment</div>
      <div class="underline"></div>
    </div>

    <div class="bottom-bar">SECTION DIVIDER</div>
  </div>
</body>
</html>
