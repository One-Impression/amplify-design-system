<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Oportunities — Quote Slide</title>
<style>
  :root {
    --cream:      #FDF8F3;
    --ink:        #0F0D0B;
    --apricot:    #E89252;
    --muted:      rgba(15,13,11,0.6);
    --rule:       rgba(15,13,11,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; }
  body {
    font-family: "Geist", -apple-system, "Helvetica Neue", Arial, sans-serif;
    background: var(--cream);
    color: var(--ink);
    overflow: hidden;
  }
  .stage {
    width: 100%;
    height: 100%;
    padding: 96px 120px;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 56px;
  }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 22px;
    color: var(--muted);
  }
  .wordmark {
    font-weight: 600;
    letter-spacing: -0.04em;
    font-size: 28px;
    color: var(--ink);
  }
  .wordmark .dot { color: var(--apricot); }

  .quote-stage {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 64px;
    padding: 0 80px;
    max-width: 1500px;
  }
  .quote-mark {
    font-family: "Charter", "Iowan Old Style", Georgia, "Times New Roman", serif;
    font-style: italic;
    font-size: 320px;
    line-height: 0.6;
    color: var(--apricot);
    height: 80px;
  }
  .quote-body {
    font-family: "Charter", "Iowan Old Style", Georgia, "Times New Roman", serif;
    font-style: italic;
    font-weight: 400;
    font-size: 88px;
    line-height: 1.15;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .attribution {
    display: flex;
    align-items: center;
    gap: 28px;
    font-size: 26px;
    color: var(--muted);
  }
  .attribution::before {
    content: "";
    width: 64px;
    height: 2px;
    background: var(--apricot);
  }
  .attribution .who {
    color: var(--ink);
    font-weight: 500;
  }

  .bottom-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--rule);
    padding-top: 24px;
    font-size: 20px;
    color: var(--muted);
  }
  .footer-mark::before {
    content: "";
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--apricot);
    margin-right: 12px;
    vertical-align: middle;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="top-bar">
      <div class="wordmark">oportunities<span class="dot">.</span></div>
      <div>15 / 24</div>
    </div>

    <div class="quote-stage">
      <div class="quote-mark">&ldquo;</div>
      <div class="quote-body">We used to brief 30 creators and hear back from 4. With Oportunities we brief 5 and hear back from 5 — because the timing is finally right.</div>
      <div class="attribution">
        <span><span class="who">Ghazal Alagh</span> · Co-founder, Mamaearth</span>
      </div>
    </div>

    <div class="bottom-bar">
      <div class="footer-mark">oportunities.in</div>
      <div>VOICES · 15</div>
    </div>
  </div>
</body>
</html>
