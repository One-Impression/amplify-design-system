<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Oportunities — Deck Cover</title>
<meta name="viewport" content="width=1920, initial-scale=1" />
<style>
  /* 16:9 slide @ 1920×1080. Print-to-PDF or use as <iframe> in deck tools. */
  :root {
    --cream:      #FDF8F3;
    --ink:        #0F0D0B;
    --apricot:    #E89252;
    --apricot-2:  #F0A668;
    --terracotta: #D87B6E;
    --purple:     #6B4FA0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; }
  body {
    font-family: "Geist", -apple-system, "Helvetica Neue", Arial, sans-serif;
    background: var(--cream);
    color: var(--ink);
    overflow: hidden;
    position: relative;
  }
  .gradient {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg,
      rgba(232,146,82,0.12) 0%,
      rgba(216,123,110,0.10) 50%,
      rgba(107,79,160,0.18) 100%);
    pointer-events: none;
  }
  .gradient::after {
    content: "";
    position: absolute;
    right: -300px;
    top: -200px;
    width: 1200px;
    height: 1200px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(232,146,82,0.35) 0%, rgba(232,146,82,0) 60%);
    filter: blur(20px);
  }
  .stage {
    position: relative;
    width: 100%;
    height: 100%;
    padding: 96px 120px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    font-size: 22px;
    letter-spacing: 0.01em;
    color: rgba(15,13,11,0.6);
  }
  .wordmark-small {
    font-weight: 600;
    letter-spacing: -0.04em;
    font-size: 28px;
    color: var(--ink);
  }
  .wordmark-small .dot { color: var(--apricot); }

  .center {
    display: flex;
    flex-direction: column;
    gap: 56px;
  }
  .wordmark-hero {
    font-weight: 600;
    letter-spacing: -0.04em;
    font-size: 320px;
    line-height: 0.9;
    color: var(--ink);
  }
  .wordmark-hero .dot { color: var(--apricot); }
  .tagline {
    font-size: 56px;
    line-height: 1.15;
    font-weight: 400;
    color: rgba(15,13,11,0.78);
    max-width: 1200px;
    letter-spacing: -0.015em;
  }

  .bottom {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    font-size: 22px;
    color: rgba(15,13,11,0.55);
  }
  .bottom .meta { font-feature-settings: "tnum"; }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 18px;
    border-radius: 999px;
    background: rgba(232,146,82,0.14);
    color: var(--apricot);
    font-size: 20px;
    font-weight: 500;
  }
  .pill::before {
    content: "";
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--apricot);
  }
</style>
</head>
<body>
  <div class="gradient" aria-hidden="true"></div>
  <div class="stage">
    <div class="top">
      <div class="wordmark-small">oportunities<span class="dot">.</span></div>
      <div class="pill">DRAFT</div>
    </div>

    <div class="center">
      <div class="wordmark-hero">oportunities<span class="dot">.</span></div>
      <div class="tagline">Creator intent, visible. Find the brand-fit moment before your competition does.</div>
    </div>

    <div class="bottom">
      <div class="meta">PRESENTED BY APAKSH GUPTA · ONE IMPRESSION</div>
      <div class="meta">MAY 2026</div>
    </div>
  </div>
</body>
</html>
