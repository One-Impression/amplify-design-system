      <rect x="0" y="0" width="180" height="180" rx="40" ry="40"/>
    </clipPath>
    <style>
      .icon-text {
        font-family: "Geist", "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 600;
        font-size: 98px;
        letter-spacing: -0.04em;
        fill: #F4ECE0;
